# Generates the contribution snake animation used at the bottom of the profile README.
#
# WHERE THIS GOES:  in the `devrunch/devrunch` repo, at  .github/workflows/snake.yml
#
# It writes snake.svg to an `output` branch, which the README then loads from:
#   https://raw.githubusercontent.com/devrunch/devrunch/output/snake.svg
#
# Runs every 12 hours, and you can trigger it by hand from the Actions tab.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: devrunch
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#B8860B&color_dots=#1a1a2e,#5c3a0a,#8B1A1A,#B8860B,#f0c75e

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
